<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>涟 Lian</title>
<meta name="description" content="涟（Lian）：深海海蛞蝓 × 白色犬兽人共生体。个人主页。">

<!-- ============ 字体：Noto Sans CJK 多语 + 拉丁等宽 ============ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
:root {
  --bg:        #0a0a0a;
  --bg-soft:   #111113;
  --line:      #1f1f22;
  --text:      #f5f5f4;
  --text-dim:  #a1a1aa;
  --text-faint:#52525b;
  --goo-color:   255, 255, 255;
  --goo-opacity: .85;
  --waves-opacity: .14;
  --font-sans: 'Noto Sans SC', 'Noto Sans JP', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'Noto Sans SC', 'Noto Sans JP', monospace;
  --sp-1: 4px;  --sp-2: 8px;   --sp-3: 12px;  --sp-4: 16px;
  --sp-6: 24px; --sp-8: 32px;  --sp-12: 48px; --sp-16: 64px;
  --page-pad-x: clamp(24px, 9vw, 120px);
  --page-pad-y: clamp(16px, 3vh, 32px);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}
* {
  user-select: none;
  -webkit-user-select: none;
}
body.has-cursor,
body.has-cursor a,
body.has-cursor button {
  cursor: none;
}
.cursor-dot {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 100;
  width: 8px;
  height: 8px;
  margin: -4px 0 0 -4px;
  border-radius: 50%;
  background: rgb(var(--goo-color));
  pointer-events: none;
  opacity: 0;
  transition:
    opacity .3s ease,
    background-color .8s ease,
    border-color .8s ease,
    width .25s ease, height .25s ease, margin .25s ease;
}
.cursor-dot.visible { opacity: .9; }
.cursor-dot.hovering {
  width: 20px;
  height: 20px;
  margin: -10px 0 0 -10px;
  opacity: .5;
}
.cursor-dot.forbidden {
  width: 22px;
  height: 22px;
  margin: -11px 0 0 -11px;
  background: transparent;
  border: 2px solid rgb(var(--goo-color));
  opacity: .95;
}
.cursor-dot.forbidden::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 50%;
  width: 28px;
  height: 2px;
  background: rgb(var(--goo-color));
  transform: translate(-50%, -50%) rotate(-45deg);
  transition: background-color .8s ease;
}
a-waves {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  opacity: var(--waves-opacity);
  transition: opacity .6s ease;
}
a-waves svg {
  display: block;
  width: 100%;
  height: 100%;
}
a-waves path {
  fill: none;
  stroke: rgb(var(--goo-color));
  stroke-width: 1px;
  transition: stroke .8s ease;
}
.topbar, .hero, .links, .footer {
  position: relative;
  z-index: 1;
}
.topbar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-8);
  padding: var(--page-pad-y) var(--page-pad-x);
}
.brand {
  text-decoration: none;
  color: var(--text);
  font-weight: 900;
  font-size: 20px;
  letter-spacing: .05em;
  white-space: nowrap;
}
.lang-switch {
  display: flex;
  gap: 2px;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px;
}
.lang-btn {
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1;
  padding: 6px 10px;
  border: none;
  border-radius: 999px;
  background: transparent;
  color: var(--text-faint);
  cursor: pointer;
  transition: color .2s ease, background .2s ease;
}
.lang-btn:hover { color: var(--text-dim); }
.lang-btn.is-active {
  background: var(--text);
  color: var(--bg);
}
.hero {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: var(--sp-6) var(--page-pad-x);
  max-width: 1200px;
  margin: 0 auto;
  width: 100%;
}
.hero-tag {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-faint);
  letter-spacing: .3em;
  margin-bottom: var(--sp-6);
}
.emotion-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgb(var(--goo-color));
  transition: background-color .8s ease;
  flex-shrink: 0;
}
.emotion-label {
  color: var(--text-faint);
  letter-spacing: .2em;
}
.emotion-label::before { content: '· '; }
.hero-title {
  font-size: clamp(3rem, 13vh, 7rem);
  font-weight: 900;
  line-height: 1.02;
  letter-spacing: .02em;
  min-height: 1.02em;
}
.hero-title::after {
  content: '_';
  font-family: var(--font-mono);
  font-weight: 400;
  color: var(--text-dim);
  animation: caret-blink 1.1s step-end infinite;
}
@keyframes caret-blink { 50% { opacity: 0; } }
.hero-goo {
  position: relative;
  height: 44px;
  margin-top: var(--sp-2);
  filter: url(#goo);
  opacity: var(--goo-opacity);
  pointer-events: none;
}
.drip {
  position: absolute;
  top: 0;
  border-radius: 50%;
  background: rgb(var(--goo-color));
  transition: background-color .8s ease;
  animation: drip-fall 3.2s cubic-bezier(.5, 0, .8, .4) infinite;
}
.drip-1 { left: 8px;  width: 9px; height: 9px; animation-delay: 0s; }
.drip-2 { left: 30px; width: 6px; height: 6px; animation-delay: 1.6s; }
@keyframes drip-fall {
  0%   { transform: translateY(0)    scaleY(1);   opacity: 0; }
  8%   { opacity: 1; }
  35%  { transform: translateY(9px)  scaleY(1.9); }
  70%  { transform: translateY(28px) scaleY(1.1); opacity: 1; }
  100% { transform: translateY(38px) scaleY(.6);  opacity: 0; }
}
.hero-desc {
  margin-top: var(--sp-4);
  max-width: 520px;
  color: var(--text-dim);
  font-size: 15px;
}
.links {
  flex-shrink: 0;
  max-width: 1200px;
  margin: 0 auto;
  width: 100%;
  padding: 0 var(--page-pad-x) var(--sp-4);
  display: flex;
  flex-direction: column;
}
.link-card {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-6);
  width: 100%;
  padding: var(--sp-4) var(--sp-2);
  border: none;
  border-top: 1px solid var(--line);
  background: transparent;
  text-decoration: none;
  text-align: left;
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.75;
  cursor: pointer;
  transition: padding-left .25s ease, background .25s ease;
}
.link-card:hover {
  padding-left: var(--sp-6);
  background: rgba(17, 17, 19, .75);
}
.link-name {
  font-size: clamp(17px, 2vw, 20px);
  font-weight: 700;
  min-width: 6em;
}
.link-meta {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-faint);
  flex: 1;
}
.link-arrow {
  font-family: var(--font-mono);
  color: var(--text-faint);
  transition: transform .25s ease, color .8s ease;
}
.link-card:hover .link-arrow {
  transform: translateX(4px);
  color: rgb(var(--goo-color));
}
.link-card.is-sealed {
  cursor: not-allowed;
  opacity: .45;
}
.link-card.is-sealed:hover {
  padding-left: var(--sp-2);
  background: transparent;
}
.link-card.is-sealed .link-name,
.link-card.is-sealed .link-meta {
  color: var(--text-faint);
}
.link-status {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: .2em;
  color: var(--text-faint);
  white-space: nowrap;
}
.link-status::before {
  content: '⊘ ';
}
.social-toggle .link-arrow {
  transition: transform .3s ease, color .8s ease;
}
.social-toggle[aria-expanded="true"] .link-arrow {
  transform: rotate(90deg);
  color: rgb(var(--goo-color));
}
.social-toggle[aria-expanded="true"]:hover .link-arrow {
  transform: rotate(90deg);
}
.social-sub {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows .35s cubic-bezier(.4, 0, .2, 1);
  border-bottom: 1px solid var(--line);
}
.social-sub.open { grid-template-rows: 1fr; }
.social-sub-inner { overflow: hidden; }
.social-link {
  display: flex;
  align-items: baseline;
  gap: var(--sp-4);
  padding: var(--sp-3) var(--sp-2) var(--sp-3) var(--sp-8);
  text-decoration: none;
  color: var(--text-dim);
  font-size: 15px;
  font-weight: 500;
  transition: color .2s ease, background .2s ease, padding-left .25s ease;
}
.social-link:hover {
  color: var(--text);
  background: rgba(17, 17, 19, .75);
  padding-left: var(--sp-12);
}
.social-link .handle {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-faint);
  flex: 1;
}
.social-link .arrow {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-faint);
}
.footer {
  flex-shrink: 0;
  padding: var(--sp-4) var(--page-pad-x) var(--page-pad-y);
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--sp-3);
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-faint);
  letter-spacing: .12em;
}
@media (max-width: 720px) {
  .link-name { min-width: 0; }
  .link-meta { display: none; }
  .social-link { padding-left: var(--sp-4); }
  .social-link:hover { padding-left: var(--sp-6); }
}
@media (max-height: 640px) {
  .hero { flex: none; padding-top: var(--sp-12); padding-bottom: var(--sp-12); }
}
@media (prefers-reduced-motion: reduce) {
  .drip { animation: none; opacity: 0; }
  .hero-title::after { animation: none; }
  a-waves, .cursor-dot { display: none; }
  html { scroll-behavior: auto; }
}
</style>

<script>
class Noise {
  constructor(seed = Math.random()) {
    this.p = new Uint8Array(256);
    let s = Math.floor(seed * 256) || 1;
    for (let i = 0; i < 256; i++) {
      s = (s * 16807) % 2147483647;
      this.p[i] = s % 256;
    }
  }
  fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  lerp(a, b, t) { return a + t * (b - a); }
  grad(h, x, y) {
    const u = h < 4 ? x : y;
    const v = h < 4 ? y : x;
    return ((h & 1) ? -u : u) + ((h & 2) ? -2 * v : 2 * v);
  }
  perlin2(x, y) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    x -= Math.floor(x); y -= Math.floor(y);
    const u = this.fade(x), v = this.fade(y);
    const A = this.p[X] + Y, B = this.p[X + 1 & 255] + Y;
    return this.lerp(
      this.lerp(this.grad(this.p[A] & 7, x, y),
                this.grad(this.p[B] & 7, x - 1, y), u),
      this.lerp(this.grad(this.p[A + 1 & 255] & 7, x, y - 1),
                this.grad(this.p[B + 1 & 255] & 7, x - 1, y - 1), u),
      v) * 0.5;
  }
}

function reducedMotionCheck() {
  return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}
const reducedMotion = reducedMotionCheck();

class AWaves extends HTMLElement {
  connectedCallback() {
    this.svg = this.querySelector('.js-svg');
    this.mouse = {
      x: -10, y: 0, lx: 0, ly: 0, sx: 0, sy: 0,
      v: 0, vs: 0, a: 0, set: false,
    };
    this.lines = [];
    this.paths = [];
    this.noise = new Noise(Math.random());
    this.running = true;
    this.setSize();
    this.setLines();
    this.bindEvents();
    requestAnimationFrame(this.tick.bind(this));
  }
  bindEvents() {
    window.addEventListener('resize', this.onResize.bind(this));
    window.addEventListener('pointermove', this.onPointerMove.bind(this));
    document.addEventListener('visibilitychange', () => {
      this.running = !document.hidden;
      if (this.running) requestAnimationFrame(this.tick.bind(this));
    });
  }
  onResize() {
    this.setSize();
    this.setLines();
  }
  onPointerMove(e) {
    this.updatePointerPosition(e.clientX, e.clientY);
  }
  updatePointerPosition(x, y) {
    const { mouse } = this;
    mouse.x = x - this.bounding.left;
    mouse.y = y - this.bounding.top + window.scrollY;
    if (!mouse.set) {
      mouse.sx = mouse.x; mouse.sy = mouse.y;
      mouse.lx = mouse.x; mouse.ly = mouse.y;
      mouse.set = true;
    }
  }
  setSize() {
    this.bounding = this.getBoundingClientRect();
    this.svg.style.width = `${this.bounding.width}px`;
    this.svg.style.height = `${this.bounding.height}px`;
  }
  setLines() {
    const { width, height } = this.bounding;
    this.lines = [];
    this.paths.forEach(p => p.remove());
    this.paths = [];
    const xGap = 14, yGap = 36;
    const oWidth = width + 200, oHeight = height + 30;
    const totalLines = Math.ceil(oWidth / xGap);
    const totalPoints = Math.ceil(oHeight / yGap);
    const xStart = (width - xGap * totalLines) / 2;
    const yStart = (height - yGap * totalPoints) / 2;
    for (let i = 0; i <= totalLines; i++) {
      const points = [];
      for (let j = 0; j <= totalPoints; j++) {
        points.push({
          x: xStart + xGap * i,
          y: yStart + yGap * j,
          wave: { x: 0, y: 0 },
          cursor: { x: 0, y: 0, vx: 0, vy: 0 },
        });
      }
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      this.svg.appendChild(path);
      this.paths.push(path);
      this.lines.push(points);
    }
  }
  movePoints(time) {
    const { lines, mouse, noise } = this;
    lines.forEach(points => {
      points.forEach(p => {
        const move = noise.perlin2(
          (p.x + time * 0.0125) * 0.002,
          (p.y + time * 0.005) * 0.0015
        ) * 12;
        p.wave.x = Math.cos(move) * 32;
        p.wave.y = Math.sin(move) * 16;
        const dx = p.x - mouse.sx;
        const dy = p.y - mouse.sy;
        const d = Math.hypot(dx, dy);
        const l = Math.max(175, mouse.vs);
        if (d < l) {
          const s = 1 - d / l;
          const f = Math.cos(d * 0.001) * s;
          p.cursor.vx += Math.cos(mouse.a) * f * l * mouse.vs * 0.00065;
          p.cursor.vy += Math.sin(mouse.a) * f * l * mouse.vs * 0.00065;
        }
        p.cursor.vx += (0 - p.cursor.x) * 0.005;
        p.cursor.vy += (0 - p.cursor.y) * 0.005;
        p.cursor.vx *= 0.925;
        p.cursor.vy *= 0.925;
        p.cursor.x += p.cursor.vx * 2;
        p.cursor.y += p.cursor.vy * 2;
        p.cursor.x = Math.min(100, Math.max(-100, p.cursor.x));
        p.cursor.y = Math.min(100, Math.max(-100, p.cursor.y));
      });
    });
  }
  moved(point, withCursorForce = true) {
    const coords = {
      x: point.x + point.wave.x + (withCursorForce ? point.cursor.x : 0),
      y: point.y + point.wave.y + (withCursorForce ? point.cursor.y : 0),
    };
    coords.x = Math.round(coords.x * 10) / 10;
    coords.y = Math.round(coords.y * 10) / 10;
    return coords;
  }
  drawLines() {
    const { lines, paths } = this;
    lines.forEach((points, lIndex) => {
      let p1 = this.moved(points[0], false);
      let d = `M ${p1.x} ${p1.y}`;
      points.forEach((pt, pIndex) => {
        const isLast = pIndex === points.length - 1;
        const m = this.moved(pt, !isLast);
        d += `L ${m.x} ${m.y}`;
      });
      paths[lIndex].setAttribute('d', d);
    });
  }
  tick(time) {
    if (!this.running) return;
    const { mouse } = this;
    mouse.sx += (mouse.x - mouse.sx) * 0.1;
    mouse.sy += (mouse.y - mouse.sy) * 0.1;
    const dx = mouse.x - mouse.lx;
    const dy = mouse.y - mouse.ly;
    const d = Math.hypot(dx, dy);
    mouse.v = d;
    mouse.vs += (d - mouse.vs) * 0.1;
    mouse.vs = Math.min(100, mouse.vs);
    mouse.lx = mouse.x;
    mouse.ly = mouse.y;
    mouse.a = Math.atan2(dy, dx);
    this.movePoints(time);
    this.drawLines();
    requestAnimationFrame(this.tick.bind(this));
  }
}

if (!reducedMotion) {

const titleEl = document.getElementById('heroTitle');
let typeTimer = null;
const TYPE_SPEED = 140;
const ERASE_SPEED = 50;

function typeTitle(text) {
  clearTimeout(typeTimer);
  if (reducedMotion) {
    titleEl.textContent = text;
    return;
  }
  const current = titleEl.textContent;
  let i = current.length;
  (function erase() {
    if (i > 0) {
      titleEl.textContent = current.slice(0, --i);
      typeTimer = setTimeout(erase, ERASE_SPEED);
      return;
    }
    let j = 0;
    (function type() {
      if (j <= text.length) {
        titleEl.textContent = text.slice(0, j++);
        typeTimer = setTimeout(type, TYPE_SPEED);
      }
    })();
  })();
}

const EMOTIONS = [
  { max: 15,  color: '255, 255, 255', key: 'mood.0', waves: .14 },
  { max: 35,  color: '94, 234, 212',  key: 'mood.1', waves: .18 },
  { max: 55,  color: '103, 232, 249', key: 'mood.2', waves: .22 },
  { max: 75,  color: '167, 139, 250', key: 'mood.3', waves: .26 },
  { max: 90,  color: '244, 114, 182', key: 'mood.4', waves: .30 },
  { max: 100, color: '248, 113, 113', key: 'mood.5', waves: .34 }
];

const emotionLabel = document.getElementById('emotionLabel');
let energy = 0;
let currentStage = 0;
let currentLang = 'zh';

function addEnergy(n) {
  energy = Math.min(100, energy + n);
}

if (!reducedMotion) {
  let lastMove = 0;
  window.addEventListener('pointermove', () => {
    const now = Date.now();
    if (now - lastMove > 120) {
      lastMove = now;
      addEnergy(1.5);
    }
  });
  window.addEventListener('pointerdown', () => addEnergy(8));
  document.querySelectorAll('.link-card:not(.is-sealed), .social-link, .lang-btn, .brand')
    .forEach(el => el.addEventListener('mouseenter', () => addEnergy(6)));
  setInterval(() => {
    energy = Math.max(0, energy - 2);
    let stage = EMOTIONS.findIndex(e => energy <= e.max);
    if (stage === -1) stage = EMOTIONS.length - 1;
    if (stage !== currentStage) {
      currentStage = stage;
      const e = EMOTIONS[stage];
      document.documentElement.style
        .setProperty('--goo-color', e.color);
      document.documentElement.style
        .setProperty('--waves-opacity', e.waves);
      emotionLabel.textContent = I18N[currentLang][e.key];
    }
  }, 400);
}

(function initCursor() {
  if (reducedMotion) return;
  if (!window.matchMedia('(pointer: fine)').matches) return;
  const dot = document.getElementById('cursorDot');
  document.body.classList.add('has-cursor');
  let cx = -100, cy = -100, tx = -100, ty = -100, shown = false;
  window.addEventListener('pointermove', e => {
    tx = e.clientX;
    ty = e.clientY;
    if (!shown) {
      shown = true;
      dot.classList.add('visible');
    }
  });
  document.addEventListener('pointerleave', () => {
    shown = false;
    dot.classList.remove('visible');
  });
  document.addEventListener('mouseover', e => {
    const forbidden = !!e.target.closest('.is-sealed');
    dot.classList.toggle('forbidden', forbidden);
    dot.classList.toggle('hovering',
      !forbidden && !!e.target.closest('a, button, .link-card, .social-link, .lang-btn'));
  });
  (function follow() {
    cx += (tx - cx) * 0.18;
    cy += (ty - cy) * 0.18;
    dot.style.transform = `translate(${cx}px, ${cy}px)`;
    requestAnimationFrame(follow);
  })();
})();

const socialToggle = document.getElementById('socialToggle');
const socialSub = document.getElementById('socialSub');
socialToggle.addEventListener('click', () => {
  const open = socialSub.classList.toggle('open');
  socialToggle.setAttribute('aria-expanded', String(open));
});

const langBtns = document.querySelectorAll('.lang-btn');

function setLang(lang) {
  const dict = I18N[lang];
  if (!dict) return;
  currentLang = lang;
  document.documentElement.lang = dict._lang;
  document.title = dict._title;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (key === 'hero.title') return;
    if (dict[key] !== undefined) el.textContent = dict[key];
  });
  typeTitle(dict['hero.title']);
  emotionLabel.textContent = dict[EMOTIONS[currentStage].key];
  langBtns.forEach(b =>
    b.classList.toggle('is-active', b.dataset.lang === lang));
  localStorage.setItem('lian-lang', lang);
}

langBtns.forEach(b =>
  b.addEventListener('click', () => setLang(b.dataset.lang)));

(function initLang() {
  const saved = localStorage.getItem('lian-lang');
  if (saved && I18N[saved]) return setLang(saved);
  const nav = (navigator.language || '').toLowerCase();
  if (nav.startsWith('ja')) return setLang('ja');
  if (nav.startsWith('en')) return setLang('en');
  setLang('zh');
})();
